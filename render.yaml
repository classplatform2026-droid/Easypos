services:
  # 1. Backend API + Realtime Socket Service
  - type: web
    name: shop-pos-backend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render dashboard

  # 2. Owner POS Frontend (Static Site)
  - type: web
    name: shop-pos-owner
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shop-pos-backend
          property: host
