services:
  # 1. Backend API + Full-Stack Service (Express + Socket.IO + Vite Static)
  - type: web
    name: shop-pos-backend
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx tsx server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MONGODB_URI
        value: mongodb+srv://mdmutasimbillahsaad_db_user:QGSKlkxhnhkPJwFz@cluster0.j29uko9.mongodb.net/shopdb?appName=Cluster0
      - key: MONGODB_DB_NAME
        value: shopdb

  # 2. Owner POS Frontend (Static Site)
  - type: web
    name: shop-pos-owner
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shop-pos-backend
          property: host
